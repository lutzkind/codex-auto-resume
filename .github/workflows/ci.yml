name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-auto-resume-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }} / python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Show interpreter
        run: python3 -VV
      - name: Unit and integration tests
        run: python3 -W ignore::ResourceWarning -m unittest discover -s tests -t tests -v
      - name: Compile check
        run: python3 -m compileall -q src bin/codex-auto-resume

  packaging:
    name: plugin packaging
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ci, isolated]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Validate plugin, hook and marketplace manifests
        run: python3 scripts/check-manifests.py

  hygiene:
    name: secrets and hygiene
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ci, isolated]
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: scripts/secret-scan.sh
      - name: The implementation never resumes with the most recent session
        run: python3 scripts/check-no-last.py
      - name: Trailing whitespace
        run: |
          if grep -rIn --exclude-dir=.git -E ' +$' . ; then
            echo "::error::trailing whitespace"
            exit 1
          fi
          echo "ok"
