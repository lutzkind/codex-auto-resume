name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-auto-resume-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }} / python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Show interpreter
        run: python -VV
      - name: Unit and integration tests
        run: python -W ignore::ResourceWarning -m unittest discover -s tests -t tests -v
      - name: Compile check
        run: python -m compileall -q src bin/codex-auto-resume

  # The lifecycle that matters: the helper installed, started, woken and used to
  # resume an exact session by the real platform service manager (systemd --user,
  # launchd, Task Scheduler). If a runner's user session cannot provide that
  # facility the test prints the exact limitation instead of passing silently.
  platform-lifecycle:
    name: real lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CODEX_AUTO_RESUME_PLATFORM_IT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Platform lifecycle through the real service manager
        timeout-minutes: 15
        run: python -W ignore::ResourceWarning -m unittest discover -s tests -t tests -p "test_platform_integration.py" -v
      - name: Windows service state (diagnostic)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          schtasks /query /tn codex-auto-resume-helper /v /fo LIST
          if ($LASTEXITCODE -ne 0) { Write-Host "no scheduled task (schtasks exit $LASTEXITCODE)" }
          Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
            Select-Object ProcessId, CommandLine | Format-List
          exit 0

  packaging:
    name: plugin packaging
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ci, isolated]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Validate plugin, hook and marketplace manifests
        run: python3 scripts/check-manifests.py

  hygiene:
    name: secrets and hygiene
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ci, isolated]
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: scripts/secret-scan.sh
      - name: The implementation never resumes with the most recent session
        run: python3 scripts/check-no-last.py
      - name: Trailing whitespace
        run: |
          if grep -rIn --exclude-dir=.git -E ' +$' . ; then
            echo "::error::trailing whitespace"
            exit 1
          fi
          echo "ok"
