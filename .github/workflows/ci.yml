name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }} / python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Show interpreter
        run: python3 -VV
      - name: Unit and integration tests
        run: python3 -W ignore::ResourceWarning -m unittest discover -s tests -t tests -v
      - name: Compile check
        run: python3 -m compileall -q src bin/codex-auto-resume

  packaging:
    name: plugin packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate plugin, hook and marketplace manifests
        run: python3 scripts/check-manifests.py

  hygiene:
    name: secrets and hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: scripts/secret-scan.sh
      - name: The implementation never resumes with the most recent session
        run: python3 scripts/check-no-last.py
      - name: Trailing whitespace
        run: |
          if grep -rIn --exclude-dir=.git -E ' +$' . ; then
            echo "::error::trailing whitespace"
            exit 1
          fi
          echo "ok"
