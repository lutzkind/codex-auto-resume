name: CI (lutzkind standard)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-auto-resume-ci-standard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Standard checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ci, isolated]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.x'
      - name: Run declared setup
        id: setup
        shell: bash
        run: |
          echo 'has_setup=false' >> "$GITHUB_OUTPUT"
      - name: Run declared checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m unittest discover -s tests -v
      - name: Check agent-friendliness contract
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci-standard/agent_friendliness.py --root .
      - name: Clean generated workspace data
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf .pytest_cache .mypy_cache .ruff_cache coverage dist build
