standard_version: 2.5.2
profile: mixed
default_branch: main
self_hosted_labels:
  - self-hosted
  - Linux
  - X64
  - ci
  - isolated
heavy_checks:
  enabled: false
custom_commands:
  setup: 'git diff --check'
  checks: 'python -m unittest discover -s tests -v'
exceptions:
  - 'fast-ci-review-required: .github/workflows/ci.yml: heavy-check-path-split-recommended'
