standard_version: 2.5.2
profile: mixed
default_branch: main
self_hosted_labels:
  - self-hosted
  - Linux
  - X64
  - ci
  - isolated
heavy_checks:
  enabled: false
custom_commands:
  setup: 'git diff --check'
  checks: 'python -VV && python -W ignore::ResourceWarning -m unittest discover -s tests -t tests -v && python -m compileall -q src bin/codex-auto-resume && python -W ignore::ResourceWarning -m unittest discover -s tests -t tests -p "test_platform_integration.py" -v && python -m unittest discover -s tests -v'
exceptions:
  - 'fast-ci-review-required: .github/workflows/ci.yml: heavy-check-path-split-recommended'
